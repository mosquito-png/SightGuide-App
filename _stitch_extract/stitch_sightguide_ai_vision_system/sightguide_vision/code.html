<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SightGuide - Vision Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .sightguide-core-processing {
            animation: breathe 3s infinite ease-in-out;
        }
        .sightguide-core-glow {
            animation: rotate-glow 4s infinite linear;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes rotate-glow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#656466",
                    "tertiary-container": "#e4e2e4",
                    "on-surface": "#e2e2e2",
                    "on-primary-fixed-variant": "#454747",
                    "primary-fixed-dim": "#c6c6c7",
                    "on-secondary-fixed-variant": "#46464b",
                    "on-background": "#e2e2e2",
                    "background": "#131313",
                    "surface-container-low": "#1b1b1b",
                    "on-secondary-fixed": "#1a1b1f",
                    "error": "#ffb4ab",
                    "on-primary-fixed": "#1a1c1c",
                    "surface-container": "#1f1f1f",
                    "inverse-primary": "#5d5f5f",
                    "secondary": "#c6c6cb",
                    "primary-fixed": "#e2e2e2",
                    "error-container": "#93000a",
                    "on-primary-container": "#636565",
                    "surface-container-lowest": "#0e0e0e",
                    "on-secondary": "#2f3034",
                    "inverse-surface": "#e2e2e2",
                    "inverse-on-surface": "#303030",
                    "on-tertiary-fixed": "#1b1b1d",
                    "surface-bright": "#393939",
                    "on-error-container": "#ffdad6",
                    "surface-container-highest": "#353535",
                    "surface-variant": "#353535",
                    "surface": "#131313",
                    "primary": "#ffffff",
                    "tertiary": "#ffffff",
                    "surface-container-high": "#2a2a2a",
                    "outline": "#8e9192",
                    "secondary-container": "#46464b",
                    "on-error": "#690005",
                    "on-secondary-container": "#b5b4ba",
                    "on-tertiary": "#303032",
                    "outline-variant": "#444748",
                    "primary-container": "#e2e2e2",
                    "secondary-fixed": "#e3e2e7",
                    "secondary-fixed-dim": "#c6c6cb",
                    "surface-tint": "#c6c6c7",
                    "on-surface-variant": "#c4c7c8",
                    "tertiary-fixed": "#e4e2e4",
                    "on-primary": "#2f3131",
                    "tertiary-fixed-dim": "#c8c6c8",
                    "surface-dim": "#131313",
                    "on-tertiary-fixed-variant": "#474649"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "24px",
                    "margin-desktop": "64px",
                    "unit": "8px",
                    "gutter": "16px",
                    "touch-target-min": "56px"
            },
            "fontFamily": {
                    "label-bold": [
                            "Inter"
                    ],
                    "headline-lg": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Inter"
                    ],
                    "body-xl": [
                            "Inter"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "headline-lg-mobile": [
                            "Inter"
                    ],
                    "display-core": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "label-bold": [
                            "16px",
                            {
                                    "lineHeight": "20px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "700"
                            }
                    ],
                    "headline-lg": [
                            "32px",
                            {
                                    "lineHeight": "40px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "letterSpacing": "0em",
                                    "fontWeight": "600"
                            }
                    ],
                    "body-xl": [
                            "20px",
                            {
                                    "lineHeight": "30px",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "400"
                            }
                    ],
                    "body-lg": [
                            "18px",
                            {
                                    "lineHeight": "28px",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-lg-mobile": [
                            "28px",
                            {
                                    "lineHeight": "34px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "display-core": [
                            "48px",
                            {
                                    "lineHeight": "56px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ]
            }
    },
        },
      }
    </script>
</head>
<body class="bg-background text-on-background font-body-lg h-screen w-full overflow-hidden relative">
<!-- Camera Feed Background Simulation -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover opacity-60" data-alt="A slightly blurred, dimly lit indoor hallway perspective from a person's point of view. High contrast, cinematic lighting, with a focus on depth. Muted tones to allow UI overlays to stand out." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6aE8gSFT17CJEnPHqTscr_zySqBzsXoC8MtnNqad0-KbaEPSyhtHvDSItnTimAUzokC8NIVPbm-dIKfSrrYtL5_RkZt-jOkZIepOKvddJrQKrZRBwvEgBy7GXrU0bsH-MXrpvZiPnoJgIpC7PaaMEst4UnfKm0GArJzN0WWb-kso0EgLihnxYvJ_nr9KdUKrBOPnB6qG6Hir0XVClQ525H2ChUg4OqnCbMhnUiVtB6O3IMMsUvfi3"/>
</div>
<!-- Top App Bar (Web) -->
<header class="hidden md:flex justify-between items-center w-full px-margin-desktop h-[64px] z-50 bg-background border-b border-outline-variant absolute top-0 left-0 right-0">
<button aria-label="Settings" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
<h1 class="text-headline-md font-headline-md tracking-widest text-primary">SIGHTGUIDE</h1>
<button aria-label="Profile" class="w-touch-target-min h-touch-target-min flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="relative w-full h-full z-10 pt-[64px] md:pt-[64px] pb-[96px] md:pb-0 p-margin-mobile md:p-margin-desktop">
<!-- Bounding Boxes Overlay -->
<div class="absolute inset-0 pointer-events-none p-margin-mobile md:p-margin-desktop">
<!-- Chair - Standard Priority -->
<div class="absolute top-1/4 left-1/4 border-2 border-outline w-64 h-64 rounded flex flex-col justify-end p-unit">
<div class="bg-surface-container-low border border-outline-variant px-gutter py-unit rounded inline-block">
<p class="text-label-bold font-label-bold text-on-surface">CHAIR</p>
<p class="text-body-lg font-body-lg text-on-surface-variant">2.4 m, Ahead</p>
</div>
</div>
<!-- Person - Standard Priority -->
<div class="absolute top-1/3 right-1/4 border-2 border-outline w-48 h-80 rounded flex flex-col justify-end p-unit">
<div class="bg-surface-container-low border border-outline-variant px-gutter py-unit rounded inline-block">
<p class="text-label-bold font-label-bold text-on-surface">PERSON</p>
<p class="text-body-lg font-body-lg text-on-surface-variant">1.8 m, Left</p>
</div>
</div>
<!-- Stairs - High Priority -->
<div class="absolute bottom-1/4 left-1/3 border-4 border-primary w-80 h-48 rounded flex flex-col justify-start p-unit shadow-[0_0_15px_rgba(255,255,255,0.2)]">
<div class="bg-primary border border-outline px-gutter py-unit rounded inline-block mb-unit self-start">
<p class="text-label-bold font-label-bold text-on-primary">HIGH PRIORITY</p>
</div>
<div class="bg-surface-container-low border border-outline-variant px-gutter py-unit rounded inline-block self-start">
<p class="text-label-bold font-label-bold text-on-surface">STAIRS</p>
<p class="text-body-lg font-body-lg text-on-surface-variant">3.1 m, Ahead</p>
</div>
</div>
</div>
<!-- SightGuide Core (Processing State) -->
<div class="absolute top-margin-mobile right-margin-mobile md:top-[88px] z-50 flex items-center space-x-gutter bg-surface-container/80 backdrop-blur-xl p-gutter rounded-full border border-outline-variant">
<div class="w-12 h-12 rounded-full bg-background border border-outline relative flex items-center justify-center sightguide-core-processing">
<div class="absolute inset-0 rounded-full border-t-2 border-primary sightguide-core-glow opacity-50"></div>
<div class="w-6 h-6 rounded-full bg-primary/20 blur-sm"></div>
</div>
<span class="text-label-bold font-label-bold text-on-surface pr-unit">Processing...</span>
</div>
</main>
<!-- Bottom Navigation Bar (Mobile) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile pb-8 pt-4 bg-background/80 backdrop-blur-xl border-t border-outline-variant rounded-t-xl">
<button aria-label="Vision" class="flex items-center justify-center bg-primary text-on-primary rounded-full w-14 h-14 hover:text-primary transition-all scale-90 haptic-feedback">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">visibility</span>
</button>
<button aria-label="Listen" class="flex items-center justify-center text-on-surface-variant w-14 h-14 hover:text-primary transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">mic</span>
</button>
<button aria-label="Explore" class="flex items-center justify-center text-on-surface-variant w-14 h-14 hover:text-primary transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">explore</span>
</button>
</nav>
<script>
        // Simple haptic feedback simulation
        document.querySelectorAll('.haptic-feedback').forEach(btn => {
            btn.addEventListener('click', () => {
                if (navigator.vibrate) {
                    navigator.vibrate(50);
                }
            });
        });
    </script>
</body></html>
