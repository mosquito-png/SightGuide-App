<style>
        body {

        .core-container {
            width: 320px;

            border-radius: 50%;
            position: relative;
            overflow: hidden;

            position: absolute;
            top: 50%;
            left: 50%;

            height: 340px;

            border: 1px solid rgba(255,255,255,0.1);
            animation: pulse 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }

            height: 8px;
            border-radius: 50%;

<!-- STITCH_SHADER_START:ANIMATION_2 class="absolute inset-0 w-full h-full" -->
<div class="absolute inset-0 w-full h-full" style="display:block;">
<canvas id="shader-canvas-ANIMATION_2" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_2');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

// Uniforms for state (Simulated via time/motion here, 
// but would be tied to app logic in a real product)
// State 1: Idle (Slow pulse)
// State 2: Listening (Active expansion/contraction)
// State 3: Processing (Fluid rotation)

varying vec2 v_texCoord;

float circle(vec2 uv, float radius, float blur) {
    float d = length(uv);
    return smoothstep(radius, radius - blur, d);
}

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    // Core color - Silver/White palette from design system
    vec3 color1 = vec3(0.95, 0.95, 0.98); // Soft White
    vec3 color2 = vec3(0.7, 0.72, 0.75);   // Silver
    vec3 bgColor = vec3(0.05, 0.05, 0.06); // Deep Charcoal/Black
    
    // Breathing/Pulse effect
    float pulse = 0.5 + 0.1 * sin(u_time * 1.5);
    
    // Fluid internal motion
    float wave = sin(uv.x * 5.0 + u_time) * 0.05;
    vec2 fluidUv = uv + vec2(wave, cos(uv.y * 3.0 + u_time * 0.8) * 0.05);
    
    // Layered Orbs for a "Core" look
    float innerCore = circle(fluidUv, 0.4 * pulse, 0.15);
    float glow = circle(uv, 0.55 * pulse, 0.4);
    
    vec3 finalColor = mix(bgColor, color2, glow * 0.4);
    finalColor = mix(finalColor, color1, innerCore);
    
    // Subtle chromatic aberration/fringe
    float fringe = circle(uv, 0.42 * pulse, 0.02);
    finalColor += vec3(0.02, 0.01, 0.05) * fringe;

    gl_FragColor = vec4(finalColor, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>
